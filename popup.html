<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeLi Calculadora</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Popup-specific styles (inline to avoid dependency) */
    body { margin: 0; padding: 0; width: 320px; font-family: system-ui, -apple-system, sans-serif; }
    .meli-popup { background: #fff; }
    @media (prefers-color-scheme: dark) { body { background: #1e1e1e; } }
  </style>
</head>
<body class="meli-popup">
  <div class="meli-popup-container">
    <!-- Header -->
    <header class="meli-popup-header">
      <div class="meli-popup-title">
        <span class="meli-popup-logo">📊</span>
        <span>MeLi Calculadora</span>
        <span class="meli-popup-version">v1.0</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="meli-popup-main">
      <!-- Sección: Mis datos por defecto -->
      <section class="meli-popup-section">
        <h2>⚙️ Mis datos por defecto</h2>
        
        <div class="meli-form-group">
          <label for="provincia">Provincia</label>
          <select id="provincia" class="meli-popup-select">
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="CABA">CABA</option>
            <option value="Córdoba">Córdoba</option>
            <option value="Santa Fe">Santa Fe</option>
            <option value="Mendoza">Mendoza</option>
            <option value="Tucumán">Tucumán</option>
            <option value="Salta">Salta</option>
            <option value="Entre Ríos">Entre Ríos</option>
            <option value="Misiones">Misiones</option>
            <option value="Chaco">Chaco</option>
            <option value="Corrientes">Corrientes</option>
            <option value="Santiago del Estero">Santiago del Estero</option>
            <option value="San Juan">San Juan</option>
            <option value="Jujuy">Jujuy</option>
            <option value="Río Negro">Río Negro</option>
            <option value="Neuquén">Neuquén</option>
            <option value="Formosa">Formosa</option>
            <option value="Chubut">Chubut</option>
            <option value="San Luis">San Luis</option>
            <option value="Catamarca">Catamarca</option>
            <option value="La Rioja">La Rioja</option>
            <option value="La Pampa">La Pampa</option>
            <option value="Santa Cruz">Santa Cruz</option>
            <option value="Tierra del Fuego">Tierra del Fuego</option>
          </select>
        </div>

        <div class="meli-form-group">
          <label for="tipo-pub">Tipo de publicación por defecto</label>
          <select id="tipo-pub" class="meli-popup-select">
            <option value="clasica">Clásica</option>
            <option value="cuotas_precio">Cuotas (precio)</option>
            <option value="cuotas_interes">Cuotas (interés)</option>
          </select>
        </div>

        <div class="meli-form-group">
          <label for="comision-custom">Comisión personalizada (opcional)</label>
          <div class="meli-popup-input-wrap">
            <input type="number" id="comision-custom" class="meli-popup-input" placeholder="13" min="0" max="100" step="0.1">
            <span class="meli-popup-suffix">%</span>
          </div>
          <small>Dejá vacío para usar la de MeLi</small>
        </div>
      </section>

      <!-- Sección: Últimos cálculos -->
      <section class="meli-popup-section">
        <h2>📋 Últimos cálculos</h2>
        <div id="historial-container" class="meli-historial-list">
          <p class="meli-empty-state">Sin cálculos recientes</p>
        </div>
      </section>

      <!-- Aviso ( skyscraper ) -->
      <section id="aviso-section" class="meli-popup-section meli-aviso" style="display: none;">
        <div id="aviso-content"></div>
      </section>

      <!-- Links -->
      <div class="meli-popup-links">
        <a href="https://www.mercadolibre.com.ar/ayuda/Costos-de-vender-un-producto_870" target="_blank" rel="noopener">
          📖 Ver ayuda
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="meli-popup-footer">
      <button id="clear-historial" class="meli-popup-btn meli-popup-btn-secondary">
        🗑️ Limpiar historial
      </button>
      <span id="save-status" class="meli-save-status"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
